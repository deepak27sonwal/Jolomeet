  <path d="M154 214c8-10 24-10 32 0M222 214c8-10 24-10 32 0" fill="none" stroke="#1E1636" stroke-width="6" stroke-linecap="round"/>
  <!-- blush -->
  <ellipse cx="150" cy="246" rx="16" ry="10" fill="#FF4F9A" opacity=".3"/>
  <ellipse cx="258" cy="246" rx="16" ry="10" fill="#FF4F9A" opacity=".3"/>
  <!-- big smile -->
  <path d="M164 252c10 40 70 40 80 0z" fill="#9E1B4E"/>
  <path d="M172 254h64c-2 8-6 12-10 14h-44c-4-2-8-6-10-14z" fill="#FFFFFF"/>
  <path d="M186 280c10 8 26 8 36 0" fill="#FF7FA8"/>
  <!-- earrings -->
  <circle cx="124" cy="262" r="6" fill="#FFFFFF"/>
  <circle cx="284" cy="262" r="6" fill="#FFFFFF"/>
